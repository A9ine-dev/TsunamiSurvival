name: Build Tsunami Survival

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Extract source
        run: unzip -q TsunamiSurvival-source.zip -d extracted

      - name: Build
        run: |
          cd extracted/TsunamiSurvival
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tsunami-survival
          path: extracted/**/build/libs/*.jar
