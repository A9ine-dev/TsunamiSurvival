
name: Build Tsunami Survival

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Extract source
        run: unzip -q TsunamiSurvival-source.zip -d extracted

      - name: Fix Fabric Loom repository configuration
        run: |
          cd extracted/TsunamiSurvival
          sed -i '/repositoriesMode/d' settings.gradle

      - name: Build mod
        run: |
          cd extracted/TsunamiSurvival
          gradle build --no-daemon

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: tsunami-survival
          path: extracted/**/build/libs/*.jar
